<script>
(function () {

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var STOP = /^(the|and|for|how|to|your|dog|dogs|a|of|in|my)$/;
  var SYN = { trimming: 'trim', nail: 'nails', nails: 'nail', groomer: 'groomer', cost: 'cost', bath: 'bathe bathing' };

  });
  function run(q) {
    var ws = q.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function (w) { return w.length > 1 && !STOP.test(w); });
    var forms = ws.map(function (w) { return [w].concat((SYN[w] || '').split(' ').filter(Boolean)); });

      return { it: it, sc: sc };

    }).join('') : '<p class="lede">No published guide matches that. Try the chapters on the right.</p>';
  }
